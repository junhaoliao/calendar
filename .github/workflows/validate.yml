name: Validate library
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  browser-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:browser
      - run: pnpm test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-validation
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: calendar-consumer-tarball
          path: artifacts/*.tgz

  unit-react18:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Peer range is ^18.3.1 || ^19; unit-test the oldest supported React.
      # Modifies only this throwaway checkout; never commit the result.
      - run: pnpm add -D --save-exact react@18.3.1 react-dom@18.3.1 @types/react@18.3.27 @types/react-dom@18.3.7
      - run: pnpm test

  consumer-runtime:
    name: consumer-runtime (node ${{ matrix.node }}, react ${{ matrix.react }})
    needs: browser-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["18.20.8", "20.19.0"]
        react: ["18.3.1", "19.2.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: calendar-consumer-tarball
          path: artifacts/
      - run: |
          tarball=$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          node scripts/consumer-runtime.mjs --tarball "$tarball" --react "${{ matrix.react }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-runtime-node-${{ matrix.node }}-react-${{ matrix.react }}
          path: artifacts/
