name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check release version and choose npm distribution tag
        id: metadata
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: node scripts/release-metadata.mjs

  validate:
    needs: release-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  publish-to-npm:
    needs: [release-metadata, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only this job can exchange an OIDC identity for npm publishing credentials.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: calendar-consumer-tarball
          path: artifacts/
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      # Pin an npm version with trusted publishing support independently of pnpm.
      - run: npm install --global npm@11.12.1
      - name: Publish the validated tarball
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          NPM_DIST_TAG: ${{ needs.release-metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tarball="./artifacts/junhaoliao-calendar-${RELEASE_VERSION}.tgz"
          test -f "$tarball"
          tar -xOf "$tarball" package/package.json |
            jq -e --arg version "$RELEASE_VERSION" \
              '.name == "@junhaoliao/calendar" and .version == $version and .private != true'
          npm publish "$tarball" --ignore-scripts --access public \
            --tag "$NPM_DIST_TAG" --registry https://registry.npmjs.org/
